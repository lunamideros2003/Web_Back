
services:
  - type: keyvalue
    name: preconteo-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: preconteo-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: KEY_PREFIX
        value: preconteo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: preconteo-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JURY_TOKEN
        generateValue: true
      - key: AUDITOR_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: METRICS_PUBLIC
        value: "true"
      - key: ENABLE_DEMO_ENDPOINTS
        value: "true"
      - key: PUBLISH_WINDOW_MS
        value: "2000"
